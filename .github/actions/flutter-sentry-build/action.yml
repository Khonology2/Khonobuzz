name: Flutter Sentry web build
description: Build Flutter web with Sentry dart-defines and upload source maps.

inputs:
  github_sha:
    description: Git commit SHA used for the Sentry release tag.
    required: true
  frontend_dsn:
    description: Flutter Sentry DSN.
    required: false
    default: ''
  sentry_environment:
    description: Sentry environment label.
    required: false
    default: 'production'
  sentry_traces_sample_rate:
    description: Performance traces sample rate.
    required: false
    default: '0.1'
  sentry_replay_session_rate:
    description: Session replay sample rate.
    required: false
    default: '0.1'
  sentry_replay_on_error_rate:
    description: Error session replay sample rate.
    required: false
    default: '1.0'
  sentry_auth_token:
    description: Sentry auth token for source map upload.
    required: false
    default: ''
  sentry_org:
    description: Sentry organization slug.
    required: false
    default: 'khonology-2w'
  sentry_project_frontend:
    description: Sentry frontend project slug.
    required: false
    default: 'khonobuzz_frontend'
  include_traces_sample_rate:
    description: Pass SENTRY_TRACES_SAMPLE_RATE to the Flutter build.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Build Flutter web
      shell: bash
      env:
        FRONTEND_DSN: ${{ inputs.frontend_dsn }}
        SENTRY_ENVIRONMENT: ${{ inputs.sentry_environment }}
        SENTRY_TRACES_SAMPLE_RATE: ${{ inputs.sentry_traces_sample_rate }}
        SENTRY_REPLAY_SESSION_RATE: ${{ inputs.sentry_replay_session_rate }}
        SENTRY_REPLAY_ON_ERROR_RATE: ${{ inputs.sentry_replay_on_error_rate }}
        GITHUB_SHA: ${{ inputs.github_sha }}
        INCLUDE_TRACES: ${{ inputs.include_traces_sample_rate }}
      run: |
        set -euo pipefail
        BUILD_ARGS=(
          --dart-define=FRONTEND_DSN="${FRONTEND_DSN}"
          --dart-define=SENTRY_RELEASE=khonobuzz-frontend@${GITHUB_SHA}
          --dart-define=SENTRY_ENV="${SENTRY_ENVIRONMENT:-production}"
          --dart-define=SENTRY_REPLAY_SESSION_RATE="${SENTRY_REPLAY_SESSION_RATE:-0.1}"
          --dart-define=SENTRY_REPLAY_ON_ERROR_RATE="${SENTRY_REPLAY_ON_ERROR_RATE:-1.0}"
        )
        if [ "${INCLUDE_TRACES}" = "true" ]; then
          BUILD_ARGS+=(--dart-define=SENTRY_TRACES_SAMPLE_RATE="${SENTRY_TRACES_SAMPLE_RATE:-0.1}")
        fi
        flutter build web --release --base-href / "${BUILD_ARGS[@]}"

    - name: Upload Sentry source maps
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry_auth_token }}
        SENTRY_ORG: ${{ inputs.sentry_org }}
        SENTRY_PROJECT: ${{ inputs.sentry_project_frontend }}
        SENTRY_RELEASE: khonobuzz-frontend@${{ inputs.github_sha }}
        SENTRY_ENVIRONMENT: ${{ inputs.sentry_environment }}
      run: |
        if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
          echo "SENTRY_AUTH_TOKEN not set — skipping source map upload"
          exit 0
        fi
        export SENTRY_ORG="${SENTRY_ORG:-khonology-2w}"
        export SENTRY_PROJECT="${SENTRY_PROJECT:-khonobuzz_frontend}"
        curl -sL https://sentry.io/get-cli/ | bash
        sentry-cli releases new "$SENTRY_RELEASE"
        sentry-cli releases set-commits "$SENTRY_RELEASE" --auto
        sentry-cli releases files "$SENTRY_RELEASE" \
          upload-sourcemaps build/web \
          --rewrite \
          --ignore-file .sentryignore
        sentry-cli releases finalize "$SENTRY_RELEASE"
        sentry-cli releases deploys "$SENTRY_RELEASE" new \
          --env "${SENTRY_ENVIRONMENT:-production}"
